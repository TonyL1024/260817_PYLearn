<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前后鼻音常用字学习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf1 100%);
    color: #2c3e50;
    min-height: 100vh;
    padding: 16px;
    font-size: 16px;
  }
  header {
    text-align: center;
    padding: 16px 8px 8px;
  }
  header h1 {
    font-size: 1.8em;
    color: #1a5276;
    margin-bottom: 6px;
  }
  header p {
    color: #566573;
    font-size: 0.95em;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin: 12px auto 18px;
    max-width: 1100px;
  }
  .toolbar button {
    border: none;
    background: #3498db;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95em;
    transition: background 0.2s, transform 0.1s;
  }
  .toolbar button:hover { background: #2980b9; }
  .toolbar button:active { transform: scale(0.96); }
  .toolbar button.ghost {
    background: #fff;
    color: #3498db;
    border: 1.5px solid #3498db;
  }
  .toolbar .font-ctrl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ecf0f1;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .toolbar .font-ctrl button {
    padding: 6px 10px;
    background: #fff;
    color: #2c3e50;
    border: 1px solid #bdc3c7;
  }
  .toolbar .font-ctrl button:hover { background: #d6dbdf; }
  .toolbar .font-ctrl span { font-size: 0.9em; color: #566573; }
  .toolbar .spacer { flex: 1 1 auto; }

  .mode-toggle {
    display: inline-flex;
    background: #ecf0f1;
    border-radius: 8px;
    padding: 3px;
  }
  .mode-toggle button {
    background: transparent;
    color: #566573;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  .mode-toggle button.active {
    background: #1abc9c;
    color: #fff;
  }

  /* 分类标签 */
  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 0 auto 16px;
    max-width: 1100px;
  }
  .category-tabs button {
    border: 1.5px solid #bdc3c7;
    background: #fff;
    color: #34495e;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: all 0.2s;
  }
  .category-tabs button.active {
    background: #2ecc71;
    color: #fff;
    border-color: #27ae60;
  }
  .category-tabs button.front { border-color: #e67e22; }
  .category-tabs button.front.active { background: #e67e22; border-color: #d35400; }
  .category-tabs button.back { border-color: #8e44ad; }
  .category-tabs button.back.active { background: #8e44ad; border-color: #7d3c98; }

  /* 列表 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 14px 8px 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    border-top: 4px solid #2ecc71;
  }
  .card.front { border-top-color: #e67e22; }
  .card.back { border-top-color: #8e44ad; }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  .card .pinyin {
    font-size: 1em;
    color: #c0392b;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .card .hanzi {
    font-size: 2.4em;
    line-height: 1.2;
    color: #1a5276;
    font-weight: 500;
  }

  /* 单个学习模式 */
  .single-view {
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
  }
  .single-card {
    background: #fff;
    border-radius: 16px;
    padding: 30px 20px 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    position: relative;
    border-top: 6px solid #2ecc71;
    text-align: center;
  }
  .single-card.front { border-top-color: #e67e22; }
  .single-card.back { border-top-color: #8e44ad; }
  .single-card .tag {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 0.8em;
    color: #fff;
    background: #2ecc71;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .single-card.front .tag { background: #e67e22; }
  .single-card.back .tag { background: #8e44ad; }
  .single-card .counter {
    position: absolute;
    top: 14px;
    right: 16px;
    color: #95a5a6;
    font-size: 0.9em;
  }
  .single-card .pinyin {
    font-size: 2em;
    color: #c0392b;
    letter-spacing: 1px;
    text-indent: 1px;
    margin-top: 6px;
    margin-bottom: 6px;
  }
  .single-card .hanzi {
    font-size: 7em;
    line-height: 1.2;
    color: #1a5276;
    font-weight: 500;
    text-align: center;
    margin: 0 0 10px;
  }
  .single-card .hint {
    color: #7f8c8d;
    font-size: 0.9em;
    margin-bottom: 6px;
  }
  .single-card .words {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .single-card .word {
    display: inline-block;
    background: #f4f6f7;
    color: #2471a3;
    border: 1px solid #d5dbdb;
    border-radius: 18px;
    padding: 6px 16px;
    font-size: 1.05em;
    cursor: pointer;
    transition: background 0.18s, transform 0.1s, border-color 0.18s;
    user-select: none;
  }
  .single-card .word:hover {
    background: #eaf2f8;
    border-color: #a9cce3;
  }
  .single-card .word:active { transform: scale(0.95); }
  .single-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .single-controls button {
    border: none;
    background: #3498db;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.2s, transform 0.1s;
  }
  .single-controls button:hover { background: #2980b9; }
  .single-controls button:active { transform: scale(0.95); }
  .single-controls button.play { background: #1abc9c; }
  .single-controls button.play:hover { background: #16a085; }
  .single-controls button.play.playing { background: #e74c3c; }
  .single-options {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-top: 14px;
    font-size: 0.9em;
    color: #566573;
    align-items: center;
  }
  .single-options label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .single-options select, .single-options input[type=number] {
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #bdc3c7;
    font-size: 0.95em;
  }

  .footer-note {
    text-align: center;
    color: #95a5a6;
    font-size: 0.85em;
    margin: 24px 0 8px;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.4em; }
    .single-card .hanzi { font-size: 5em; }
    .single-card .pinyin { font-size: 1.5em; }
  }
</style>
</head>
<body>
  <header>

    </div>
    <div class="spacer"></div>
    <div class="mode-toggle">
      <button id="modeListBtn" class="active" onclick="switchMode('list')">列表浏览</button>
      <button id="modeSingleBtn" onclick="switchMode('single')">单个学习</button>
    </div>
  </div>

  <!-- 列表模式 -->
  <div id="listView">
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="grid" id="charGrid"></div>
  </div>

  <!-- 单个学习模式 -->
  <div id="singleView" style="display:none;">
    <div class="single-card" id="singleCard">

      <div class="pinyin" id="singlePinyin"></div>
      <div class="hanzi" id="singleHanzi"></div>
      <div class="hint" id="singleHint"></div>
      <div class="words" id="singleWords"></div>
    </div>
    <div class="single-controls">
      <button onclick="singlePrev()">上一个</button>
      <button class="play" id="playBtn" onclick="togglePlay()">自动播放</button>
      <button onclick="singleNext()">下一个</button>
    </div>
    <div class="single-options">
      <label>朗读来源：
        <select id="voiceSelect"></select>
      </label>
      <label>语速：
        <input type="number" id="rateInput" value="0.8" min="0.4" max="2" step="0.1" style="width:60px;">
      </label>
      <label><input type="checkbox" id="autoVoice" checked> 自动发音</label>
    </div>
  </div>

  <div class="footer-note">点击单个字可进入学习模式 · 列表模式点击字卡亦可跳转学习</div>

  // ---- 后鼻音 iong ----
  '穷':['贫穷','穷苦','穷尽'],'琼':['琼浆','琼脂','琼瑶'],'兄':['兄弟','兄长'],
  '凶':['凶恶','凶猛'],'胸':['胸口','胸怀'],'汹':['汹涌','汹涌澎湃'],
  '匈':['匈奴','匈牙利'],'熊':['熊猫','黑熊'],'拥':['拥抱','拥护','拥有'],
  '佣':['佣人','雇佣','女佣'],'庸':['平庸','庸俗','毋庸置疑'],'永':['永远','永恒','永久'],
  '咏':['歌咏','吟咏'],'勇':['勇敢','勇气','英勇'],'俑':['兵马俑','陶俑'],
  '涌':['汹涌','涌出','涌动'],'用':['使用','用处','用处'],'踊':['踊跃','踊跃参加'],
  '蛹':['蚕蛹','蛹化'],'雍':['雍正','雍容'],'臃':['臃肿']
};

const CATEGORY_LABEL = {
  'an':'前鼻音 an','en':'前鼻音 en','in':'前鼻音 in','un':'前鼻音 un','ün':'前鼻音 ün',
  'ang':'后鼻音 ang','eng':'后鼻音 eng','ing':'后鼻音 ing','ong':'后鼻音 ong','iong':'后鼻音 iong'
};
const CATEGORY_TYPE = { // front/back
  'an':'front','en':'front','in':'front','un':'front','ün':'front',
  'ang':'back','eng':'back','ing':'back','ong':'back','iong':'back'
};

// 扁平化数据，记录每条所属分类
const ALL_CHARS = [];
['an','en','in','un','ün','ang','eng','ing','ong','iong'].forEach(cat => {
  const src = CATEGORY_TYPE[cat] === 'front' ? FRONT : BACK;
  const seen = new Set();
  src[cat].forEach(([hz, py]) => {
    const key = hz + py;
    if (!seen.has(key)) {
      seen.add(key);
      ALL_CHARS.push({ hz, py, cat, type: CATEGORY_TYPE[cat] });
    }
  });
});

// ============ 状态 ============
let currentCategory = 'all';
let baseFont = 16;     // body 基础字号 (px)
let fontScale = 1;     // 缩放因子
let mode = 'list';     // list | single
let singleIndex = 0;
let playTimer = null;
let playActive = false;

// ============ 工具函数 ============
function getFilteredChars() {
  if (currentCategory === 'all') return ALL_CHARS;
  return ALL_CHARS.filter(c => c.cat === currentCategory);
}

// 简单拼音转语音合成朗读：Web Speech API 支持直接读汉字，拼音仅作辅助
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  const v = document.getElementById('voiceSelect').value;
  if (v) {
    const voice = voices.find(x => x.name === v);
    if (voice) u.voice = voice;
  }
  u.rate = parseFloat(document.getElementById('rateInput').value) || 0.8;
  window.speechSynthesis.speak(u);
}

function stopSpeak() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

// 按顺序朗读多个文本（字 + 组词），利用浏览器语音队列自动衔接
// onDone：最后一条朗读完成后的回调
function speakSequence(texts, onDone) {
  if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const v = document.getElementById('voiceSelect').value;
  const rate = parseFloat(document.getElementById('rateInput').value) || 0.8;
  const items = texts.filter(t => t);
  if (items.length === 0) { if (onDone) onDone(); return; }
  items.forEach((t, i) => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN';
    u.rate = rate;
    if (v) {
      const voice = voices.find(x => x.name === v);
      if (voice) u.voice = voice;
    }
    if (onDone && i === items.length - 1) u.onend = onDone;
    window.speechSynthesis.speak(u);
  });
}

// ============ 渲染：分类标签 ============
function renderCategoryTabs() {
  const wrap = document.getElementById('categoryTabs');
  const cats = ['all','an','en','in','un','ün','ang','eng','ing','ong','iong'];
  wrap.innerHTML = cats.map(c => {
    const label = c === 'all' ? '全部' : CATEGORY_LABEL[c];
    const cls = c === 'all' ? '' : CATEGORY_TYPE[c];
    const active = currentCategory === c ? 'active' : '';
    return `<button class="${cls} ${active}" data-cat="${c}" onclick="selectCategory('${c}')">${label}</button>`;
  }).join('');
}

function selectCategory(cat) {
  currentCategory = cat;
  renderCategoryTabs();
  renderGrid();
}

// ============ 渲染：列表 ============
function renderGrid() {
  const grid = document.getElementById('charGrid');
  const list = getFilteredChars();
  grid.innerHTML = list.map(c => `
    <div class="card ${c.type}" onclick="jumpToSingleByHanzi('${c.hz}','${c.cat}')">
      <div class="pinyin">${c.py}</div>
      <div class="hanzi">${c.hz}</div>
    </div>
  `).join('');
}

function jumpToSingleByHanzi(hz, cat) {
  const list = getFilteredChars();
  const idx = list.findIndex(c => c.hz === hz && c.cat === cat);
  if (idx >= 0) {
    singleIndex = idx;
    switchMode('single');
  }
}

// ============ 渲染：单个学习 ============
function renderSingle() {
  const list = getFilteredChars();
  if (list.length === 0) {
    document.getElementById('singleHanzi').textContent = '—';
    document.getElementById('singlePinyin').textContent = '';
    document.getElementById('singleHint').textContent = '当前分类无数据';
    document.getElementById('singleWords').innerHTML = '';
    document.getElementById('singleTag').textContent = '';
    document.getElementById('singleCounter').textContent = '';
    return;
  }
  if (singleIndex >= list.length) singleIndex = 0;
  if (singleIndex < 0) singleIndex = list.length - 1;
  const c = list[singleIndex];
  const card = document.getElementById('singleCard');
  card.classList.remove('front','back');
  card.classList.add(c.type);
  document.getElementById('singleTag').textContent = CATEGORY_LABEL[c.cat];
  document.getElementById('singleCounter').textContent = `${singleIndex + 1} / ${list.length}`;
  document.getElementById('singleHanzi').textContent = c.hz;
  document.getElementById('singlePinyin').textContent = c.py;
  document.getElementById('singleHint').textContent =
    c.type === 'front' ? '前鼻音：韵尾收于 -n，舌尖抵上齿龈' : '后鼻音：韵尾收于 -ng，舌根抵软腭';
  // 渲染常用组词（最多 3 个）
  const words = (WORDS[c.hz] || []).slice(0, 3);
  const wordsEl = document.getElementById('singleWords');
  wordsEl.innerHTML = words.length
    ? words.map(w => `<span class="word" onclick="speak('${w}')">${w}</span>`).join('')
    : '';
  if (document.getElementById('autoVoice').checked) {
    const texts = [c.hz, ...words];
    if (playActive) {
      // 自动播放：朗读完成后稍停再切下一个
      speakSequence(texts, () => {
        if (!playActive) return;
        setTimeout(() => { if (playActive) singleNext(); }, 450);
      });
    } else {
      speakSequence(texts);
    }
  }
}

function singleNext() {
  singleIndex++;
  renderSingle();
}
function singlePrev() {
  singleIndex--;
  renderSingle();
}

// 键盘支持
document.addEventListener('keydown', (e) => {
  if (mode !== 'single') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); singleNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); singlePrev(); }
});

// ============ 模式切换 ============
function switchMode(m) {
  mode = m;
  document.getElementById('modeListBtn').classList.toggle('active', m === 'list');
  document.getElementById('modeSingleBtn').classList.toggle('active', m === 'single');
  document.getElementById('listView').style.display = m === 'list' ? '' : 'none';
  document.getElementById('singleView').style.display = m === 'single' ? '' : 'none';
  if (m === 'single') {
    renderSingle();
  } else {
    stopPlay();
    stopSpeak();
  }
}

// ============ 字号 ============
function applyFont() {
  document.body.style.fontSize = (baseFont * fontScale) + 'px';
}
function changeFont(delta) {
  fontScale = Math.min(2.5, Math.max(0.7, fontScale + delta * 0.1));
  applyFont();
}
function resetFont() {
  fontScale = 1;
  applyFont();
}

// ============ 自动播放 ============
// 若开启自动发音：朗读（字+组词）结束后再切下一个；若关闭：用计时器静默切换
function togglePlay() {
  if (playActive) { stopPlay(); return; }
  playActive = true;
  const btn = document.getElementById('playBtn');
  btn.textContent = '停止播放';
  btn.classList.add('playing');
  if (document.getElementById('autoVoice').checked) {
    // 由 speakSequence 的 onend 驱动链条
    renderSingle();
  } else {
    playTimer = setInterval(() => singleNext(), 2500);
  }
}
function stopPlay() {
  playActive = false;
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  const btn = document.getElementById('playBtn');
  if (btn) { btn.textContent = '自动播放'; btn.classList.remove('playing'); }
  stopSpeak();
}

// ============ 语音列表 ============
let voices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices();
  const sel = document.getElementById('voiceSelect');
  const cnVoices = voices.filter(v => /zh|chinese|cmn/i.test(v.lang) || /zh|chinese|mandarin/i.test(v.name));
  sel.innerHTML = '<option value="">系统默认</option>' +
    cnVoices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// ============ 初始化 ============
renderCategoryTabs();
renderGrid();
applyFont();
</script>
</body>
</html>
